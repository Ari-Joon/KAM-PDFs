<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob: https://api.github.com https://0.peerjs.com wss://0.peerjs.com; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAM Scanner</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#1e1f24">
<script src="lib/peerjs.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="scan-core.js"></script>
<script src="scan-ui.js"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1e1f24;color:#e6e6ea}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,label.btn{font:inherit;color:inherit;background:#2c2d34;border:1px solid #3d3e47;border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.primary,label.btn.primary{background:#f5b400;border-color:#f5b400;color:#111;font-weight:700}
button:disabled{opacity:.4}
input{font:inherit;color:inherit;background:#15161a;border:1px solid #3d3e47;border-radius:10px;padding:10px 12px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#26272e;border-bottom:1px solid #3d3e47}
header img{width:30px;height:30px}
header .brand{font-weight:800;color:#f5b400;font-size:17px;letter-spacing:.5px}
header .brand span{color:#e6e6ea;font-weight:500}
.pill{margin-left:auto;font-size:12px;padding:5px 10px;border-radius:999px;background:#3a3b44;border:1px solid #4a4b55;cursor:pointer;white-space:nowrap}
.pill.ok{background:#14532d;border-color:#166534;color:#bbf7d0}
.pill.err{background:#7f1d1d;border-color:#991b1b;color:#fecaca}
main{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-actions .btn{padding:18px 10px;font-size:16px;flex-direction:column}
.big-actions .btn .ico{font-size:28px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.page{position:relative;background:#26272e;border:1px solid #3d3e47;border-radius:10px;padding:6px;text-align:center}
.page img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:6px;display:block}
.page .n{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px}
.page .x{position:absolute;top:8px;right:8px;background:#b91c1c;color:#fff;border:none;border-radius:999px;width:24px;height:24px;padding:0;font-size:13px}
.page .mv{display:flex;justify-content:center;gap:6px;margin-top:6px}
.page .mv button{padding:2px 10px;font-size:13px}
.page.sent img{outline:3px solid #22c55e}
.empty{color:#8b8d96;text-align:center;padding:30px 10px;line-height:1.6}
#editor{flex:1;min-height:0;display:flex;flex-direction:column}
#editor .ks-wrap{height:100%}
footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;background:#26272e;border-top:1px solid #3d3e47}
footer #btnSend{grid-column:1/3}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet>div{background:#26272e;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px}
.sheet h3{margin:0 0 8px}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet input{flex:1;font-size:22px;letter-spacing:4px;text-transform:uppercase;text-align:center}
.muted{color:#8b8d96;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;border:1px solid #555;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90vw;text-align:center}
#prog{height:6px;background:#3d3e47;border-radius:3px;overflow:hidden;display:none}
#prog>div{height:100%;background:#f5b400;width:0;transition:width .2s}
</style>
</head>
<body>
<header><img src="logo.svg" alt=""><div class="brand">KAM <span>Scanner</span></div><span id="status" class="pill">Not connected · tap to pair</span></header>
<main>
  <section id="home" style="display:contents">
    <div class="big-actions">
      <label class="btn primary"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h2l1.4-2h7.2L17 7h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg></span>Take photo<input id="camIn" type="file" accept="image/*" capture="environment" multiple hidden></label>
      <label class="btn"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M3.6 17.5 9 12.4l3.4 3.2 3-2.8 5 4.7"/></svg></span>From gallery<input id="galIn" type="file" accept="image/*" multiple hidden></label>
    </div>
    <div id="prog"><div></div></div>
    <div id="pages" class="pages"></div>
    <div id="pagesEmpty" class="empty">No pages yet.<br>Take a photo of a document. Lay it flat on a darker surface for best results.</div>
  </section>
  <section id="editor" hidden></section>
</main>
<footer id="foot">
  <button id="btnSend" class="primary" disabled>Send to computer</button>
  <button id="btnPdf" disabled>Save PDF</button>
  <button id="btnShare" disabled>Share PDF</button>
</footer>
<div id="pair" class="sheet" hidden><div>
  <h3>Connect to your computer</h3>
  <div class="muted">In KAM PDFs on your computer click <b>Scan</b>. Scan the QR code with your phone camera, or type the 6-character code shown there.</div>
  <div class="row"><input id="codeIn" maxlength="6" placeholder="CODE" autocapitalize="characters" autocomplete="off"><button id="btnPair" class="primary">Connect</button></div>
  <div class="row"><button id="btnPairClose" style="flex:1">Close</button></div>
</div></div>
<div id="toast"></div>
<script src="scan-page.js"></script>
</body>
</html>
